name: hammasir_student
description: "اپلیکیشن دانشجوی هم‌مسیر؛ سرویس ایاب‌وذهاب دانشجویی"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # شبکه و ذخیره‌سازی
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1

  # نقشه
  flutter_map: 7.0.2
  latlong2: 0.9.1

  # تاریخ شمسی
  shamsi_date: ^1.1.1

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # اثر انگشت، عکس پروفایل
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # موقعیت کاربر روی نقشه
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
